name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_matrix:
        description: 'Also run the WordPress version matrix (slow, ~15 min)'
        type: boolean
        default: false

# Third-party actions are pinned to commit SHAs, not to tags. A tag is a
# mutable pointer: whoever controls the action repository can move v4 to a new
# commit, and every workflow that trusts the tag runs that commit with this
# repository checked out and the job's token available. The trailing comment
# records which release each SHA was, so an upgrade is still a readable diff.
#
# Refresh one with:
#   git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>

jobs:
  # The full suite, including the real WordPress block validator. Runs on the
  # PHP version most hosts are on; the matrix job below covers the rest.
  full:
    name: Full suite (PHP 8.3 + real block validation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: dom, libxml
          coverage: none

      # 22 is the floor jsdom sets (see tests/js/package.json engines). Node 20
      # installed cleanly and then threw from undici inside the validator.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      # `ci` not `install`: the lockfile pins the block library the golden
      # snapshots were generated against, and a newer one could change what
      # "valid" means underneath the suite.
      - name: Install the block validator
        run: npm --prefix tests/js ci

      # --require-validator turns a missing or broken harness into a failure.
      # A green run must never mean "block validity went unchecked".
      - name: Converter suite
        run: php tests/run.php --require-validator

      # A golden snapshot is only protection if it is committed. If running the
      # suite rewrites one, the working tree changes and this fails.
      - name: Golden snapshots are committed and current
        run: |
          php tests/run.php --update-golden --no-blocks >/dev/null
          if ! git diff --quiet -- tests/golden; then
            echo "::error::Golden snapshots are out of date. Run: php tests/run.php --update-golden"
            git --no-pager diff -- tests/golden
            exit 1
          fi

  # Every PHP version the plugin claims to support. The block validator is
  # skipped here — it is Node, not PHP, and the full job above covers it.
  php-matrix:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the declared floor (Requires PHP). The rest are the branches
        # hosts actually run. A pass proves the converter runs on each; it does
        # not prove WordPress compatibility, which still needs an install.
        # See CODEX-REVIEW-RESPONSE.md, N-08.
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Converter suite
        run: php tests/run.php --no-blocks

  # A real WordPress, in Docker, on the runner. Slower than everything above
  # (wp-env pulls images and installs core), which is why it is one version
  # rather than the whole matrix — bin/wp-matrix.sh covers the range and is
  # manual, because six clean environments take a quarter of an hour.
  #
  # Without this job the live suite would rot: it would only ever run when
  # someone remembered to run it, which for a test is the same as not existing.
  live:
    name: Live WordPress (endpoints, database, restore)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/js/package-lock.json

      - name: Install wp-env and the block validator
        run: |
          npm ci
          npm --prefix tests/js ci

      # Brings WordPress up, drives the real AJAX endpoints, round-trips every
      # fixture through MySQL, checks restore byte-identity, then validates what
      # the database holds against the real block library. Fails on any notice
      # or deprecation WordPress logs.
      - name: Live check
        run: bash bin/live-check.sh

  # The Tools screen in a real browser. The batch runner is the reason this
  # exists: it counted failed pages as successes in 2.0.0, and until now nothing
  # tested it at all.
  e2e:
    name: Admin screen (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # bin/e2e.sh runs the browser inside Playwright's own container, so the
      # job does not depend on which system libraries the runner happens to
      # carry — the same reason it is done that way locally.
      - name: Browser tests
        run: bash bin/e2e.sh

      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Multisite is the one configuration where the plugin's capability check is
  # not sufficient on its own: any site administrator has manage_options, but
  # only super admins hold unfiltered_html, so everyone else writes through
  # KSES. A Divi Code module loses its scripts and iframes to that filter.
  multisite:
    name: Multisite (KSES)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Multisite check
        run: bash bin/multisite-check.sh

  static-checks:
    name: Syntax and whitespace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check the admin script parses
        run: node --check admin/js/admin.js

      - name: Check the test harness parses
        run: |
          node --check tests/js/validate.mjs
          node --check tests/js/canonical.mjs

      - name: Check the build script parses
        run: bash -n bin/build-zip.sh

      - name: Reject whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  # Every WordPress release the plugin claims, validated against the block
  # library that release actually ships.
  #
  # The full suite above validates with one library — the newest one npm has —
  # which no released WordPress uses. That is how converted Cover blocks were
  # invalid on 6.1 through 6.7, and converted Toggles invalid on 6.3, while
  # every check in the project stayed green. See bin/block-library-matrix.sh.
  block-library-matrix:
    name: Block validity per WordPress release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: dom, libxml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # jsdom comes from tests/js; the block libraries under test are installed
      # into a cache directory by the script itself.
      - name: Install the validator harness
        run: npm --prefix tests/js ci

      - name: Cache the per-version block libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/d2g-block-library-matrix
          key: block-library-${{ hashFiles('tests/js/versions.json') }}

      - name: Matrix
        run: D2G_BL_CACHE="$HOME/.cache/d2g-block-library-matrix" bash bin/block-library-matrix.sh

  # Opt-in from the Actions tab. This is what measures `Requires at least` and
  # `Tested up to`; it should be re-run before a release and whenever the set of
  # blocks the converter emits changes.
  wp-version-matrix:
    name: WordPress version matrix
    runs-on: ubuntu-latest
    if: inputs.run_matrix
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/js/package-lock.json

      - name: Install wp-env and the block validator
        run: |
          npm ci
          npm --prefix tests/js ci

      - name: Matrix
        run: bash bin/wp-matrix.sh
